# Generar el proyecto Xcode con XcodeGen:  brew install xcodegen && xcodegen generate
name: WaViewer
options:
  bundleIdPrefix: com.waviewer
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    # Cambiar por el Team ID de tu cuenta de Apple Developer
    DEVELOPMENT_TEAM: XXXXXXXXXX

targets:
  WaViewer:
    type: application
    platform: iOS
    sources: [WaViewer, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waviewer.app
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: WA Viewer
    entitlements:
      path: WaViewer/WaViewer.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.waviewer.shared
    dependencies:
      - target: WaViewerWidget

  WaViewerWidget:
    type: app-extension
    platform: iOS
    sources: [WaViewerWidget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waviewer.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: WA Viewer Widget
    info:
      path: WaViewerWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WaViewerWidget/WaViewerWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.waviewer.shared
